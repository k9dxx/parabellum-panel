name: PARABELLUM - Publicar APK Oficial

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parabellum-android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar código da branch main
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validar versão e impedir release duplicada
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$(sed -nE 's/^VERSION_CODE=([0-9]+)$/\1/p' android-app/version.properties)"
          VERSION_NAME="$(sed -nE 's/^VERSION_NAME=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' android-app/version.properties)"
          if [[ -z "$VERSION_CODE" || -z "$VERSION_NAME" || "$VERSION_CODE" -le 1 ]]; then
            echo "::error::Versão inválida. Atualize android-app/version.properties."
            exit 1
          fi
          if gh release view "v$VERSION_NAME" -R k9dxx/parabellum-panel >/dev/null 2>&1; then
            echo "::error::Esta versão já possui um release. Aumente VERSION_CODE e VERSION_NAME."
            exit 1
          fi
          LATEST_TAG="$(gh api repos/k9dxx/parabellum-panel/releases/latest --jq '.tag_name' 2>/dev/null || true)"
          if [[ -n "$LATEST_TAG" ]]; then
            export LATEST_TAG VERSION_NAME
            python3 - <<'PY'
          import os, re, sys
          latest=os.environ['LATEST_TAG'].lstrip('v')
          requested=os.environ['VERSION_NAME']
          if re.fullmatch(r'\d+\.\d+\.\d+',latest):
              old=tuple(map(int,latest.split('.')))
              new=tuple(map(int,requested.split('.')))
              if new<=old: sys.exit('Nova VERSION_NAME deve ser maior que o release atual.')
          PY
          fi
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Verificar SDK já instalado
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"
          test -d "$SDK_ROOT"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Validar segredos e preparar assinatura
        env:
          PBLM_KEYSTORE_BASE64: ${{ secrets.PBLM_KEYSTORE_BASE64 }}
          PBLM_STORE_PASSWORD: ${{ secrets.PBLM_STORE_PASSWORD }}
          PBLM_KEY_ALIAS: ${{ secrets.PBLM_KEY_ALIAS }}
          PBLM_KEY_PASSWORD: ${{ secrets.PBLM_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PBLM_KEYSTORE_BASE64" || -z "$PBLM_STORE_PASSWORD" || -z "$PBLM_KEY_ALIAS" || -z "$PBLM_KEY_PASSWORD" ]]; then
            echo "::error::Configure os quatro secrets PBLM no GitHub antes de publicar."
            exit 1
          fi
          umask 077
          printf '%s' "$PBLM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pblm-release.jks"
          test -s "$RUNNER_TEMP/pblm-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/pblm-release.jks" -alias "$PBLM_KEY_ALIAS" -storepass "$PBLM_STORE_PASSWORD" >/dev/null
          echo "PBLM_KEYSTORE_FILE=$RUNNER_TEMP/pblm-release.jks" >> "$GITHUB_ENV"

      - name: Compilar release assinada
        env:
          PBLM_STORE_PASSWORD: ${{ secrets.PBLM_STORE_PASSWORD }}
          PBLM_KEY_ALIAS: ${{ secrets.PBLM_KEY_ALIAS }}
          PBLM_KEY_PASSWORD: ${{ secrets.PBLM_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --project-dir android-app :app:assembleRelease --no-daemon

      - name: Verificar APK e gerar checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" "dist/PARABELLUM-v$VERSION_NAME.apk"
          cd dist
          sha256sum "PARABELLUM-v$VERSION_NAME.apk" > "PARABELLUM-v$VERSION_NAME.apk.sha256"

      - name: Disponibilizar artefato de release
        uses: actions/upload-artifact@v4
        with:
          name: PARABELLUM-release-v${{ env.VERSION_NAME }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publicar lançamento oficial e APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v$VERSION_NAME" \
            "dist/PARABELLUM-v$VERSION_NAME.apk" \
            "dist/PARABELLUM-v$VERSION_NAME.apk.sha256" \
            --repo k9dxx/parabellum-panel \
            --target "$GITHUB_SHA" \
            --title "PARABELLUM Android v$VERSION_NAME" \
            --generate-notes \
            --latest

      - name: Apagar keystore temporária
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/pblm-release.jks"
