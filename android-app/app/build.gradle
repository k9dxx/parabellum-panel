plugins {
    id 'com.android.application'
}

def signingPath = System.getenv('PBLM_KEYSTORE_FILE')
def versionProperties = new Properties()
def versionFile = rootProject.file('version.properties')
if (!versionFile.exists()) {
    throw new GradleException('android-app/version.properties ausente')
}
versionFile.withInputStream { versionProperties.load(it) }
def appVersionCode = Integer.parseInt(versionProperties.getProperty('VERSION_CODE', '0'))
def appVersionName = versionProperties.getProperty('VERSION_NAME', '')
if (appVersionCode < 1 || !(appVersionName ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException('VERSION_CODE e VERSION_NAME invalidos')
}
def signingVars = ['PBLM_STORE_PASSWORD', 'PBLM_KEY_ALIAS', 'PBLM_KEY_PASSWORD']
if (signingPath && signingVars.any { !(System.getenv(it) ?: '').trim() }) {
    throw new GradleException('Configuracao de assinatura incompleta')
}
android {
    namespace 'com.pblm.parabellum'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pblm.parabellum'
        minSdk 24
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        if (signingPath) {
            release {
                storeFile file(signingPath)
                storePassword System.getenv('PBLM_STORE_PASSWORD')
                keyAlias System.getenv('PBLM_KEY_ALIAS')
                keyPassword System.getenv('PBLM_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingPath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
