plugins {
    id 'com.android.application'
}

def signingPath = System.getenv('PBLM_KEYSTORE_FILE')
android {
    namespace 'com.pblm.parabellum'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pblm.parabellum'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        if (signingPath) {
            release {
                storeFile file(signingPath)
                storePassword System.getenv('PBLM_STORE_PASSWORD')
                keyAlias System.getenv('PBLM_KEY_ALIAS')
                keyPassword System.getenv('PBLM_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingPath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
