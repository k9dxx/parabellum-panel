<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09090c"><title>⛧ PARABELLUM OS</title>
<style>
:root{--accent:#c41436;--bg:#09090d;--panel:#14141c;--text:#f5f1f3;--muted:#a8a4ad}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 70% 15%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 45%),linear-gradient(145deg,#111019,#060609);color:var(--text);font:15px system-ui,Arial;min-height:100dvh}
button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
a{color:var(--text)}.top{height:56px;background:#09090bdc;border-bottom:1px solid #ffffff18;display:flex;align-items:center;justify-content:space-between;padding:0 18px;backdrop-filter:blur(14px)}
.brand{font-weight:900;letter-spacing:2px;color:var(--accent)}.small{font-size:12px;color:var(--muted)}.btn{background:#211d26;color:white;border:1px solid #ffffff22;padding:10px 13px;border-radius:10px}.btn:hover,.tile:hover{border-color:var(--accent)}.primary{background:var(--accent);border-color:var(--accent)}
main{max-width:1180px;margin:auto;padding:32px 18px 120px}.hero{padding:25px;border:1px solid #ffffff24;border-radius:22px;background:#101015c9;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
h1{font-size:clamp(26px,5vw,46px);margin:5px 0;color:var(--accent)}h2{font-size:20px;margin:0 0 15px}p{color:var(--muted);line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-top:24px}.tile{text-align:left;border:1px solid #ffffff22;background:#15141cbb;color:var(--text);border-radius:18px;padding:20px;min-height:125px;transition:.15s}.tile b{display:block;margin:12px 0 5px}.tile span{font-size:13px;color:var(--muted)}.tile .emoji{font-size:28px}
.dock{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:9px;background:#111118ee;border:1px solid #ffffff30;border-radius:18px;z-index:30;max-width:calc(100vw - 20px);overflow:auto}
.dock button{border:0;border-radius:11px;background:#26212b;color:white;padding:12px;min-width:48px}.dock button:hover{background:var(--accent)}
.window{position:fixed;z-index:20;top:12%;left:50%;transform:translateX(-50%);width:min(680px,calc(100vw - 20px));max-height:75dvh;overflow:hidden;border:1px solid #ffffff33;background:#15131bea;border-radius:18px;box-shadow:0 20px 90px #000b;display:none}
.window.active{display:block}.winbar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#211b26;border-bottom:1px solid #ffffff20}.winbody{padding:20px;overflow:auto;max-height:calc(75dvh - 55px)}
label{display:block;margin:15px 0 7px;font-size:13px;color:var(--muted)}input,textarea{width:100%;background:#09090d;color:white;border:1px solid #ffffff30;border-radius:10px;padding:11px}textarea{min-height:180px;resize:vertical}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.card{padding:15px;background:#24202a;border:1px solid #ffffff18;border-radius:12px}
pre{white-space:pre-wrap;word-break:break-word;color:#f5a8b8;background:#09090d;padding:16px;border-radius:12px;min-height:160px}
footer{margin-top:35px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:560px){main{padding-top:18px}.window{top:65px;max-height:calc(100dvh - 150px)}.winbody{max-height:calc(100dvh - 210px)}}
</style></head><body>
<header class="top"><div><span class="brand">⛧ PBLM.OS</span> <span class="small">v1.0</span></div><div><span id="clock" class="small"></span> <button class="btn" onclick="openApp('settings')">⚙</button></div></header>
<main><section class="hero"><div><div class="small">COMUNIDADE • PARABELLUM</div><h1>SEU PORTAL. SEU DOMÍNIO.</h1><p>Um espaço de trabalho e comunidade, no seu navegador.</p></div><button class="btn primary" onclick="openApp('terminal')">⌘ Abrir terminal</button></section>
<div class="grid" id="desktop"></div><footer>⛧ PARABELLUM OS • Funciona no GitHub Pages • Dados locais neste dispositivo</footer></main>
<div class="dock" id="dock" aria-label="Aplicativos"></div>
<section class="window" id="window" role="dialog" aria-modal="true" aria-labelledby="winTitle"><div class="winbar"><b id="winTitle">Aplicativo</b><button class="btn" onclick="closeApp()" aria-label="Fechar">✕</button></div><div class="winbody" id="winBody"></div></section>
<script>
'use strict';
const APPS=[['home','🏠','Portal','Voltar ao portal'],['terminal','⌘','Terminal','Comandos internos'],['notes','📝','Notas','Bloco de notas local'],['tasks','☑','Tarefas','Lista de tarefas'],['links','🔗','Atalhos','Redes e páginas'],['files','📁','Arquivos','Links do projeto'],['settings','⚙','Aparência','Personalize seu OS'],['about','⛧','Sobre','Informações do sistema']];
const $=id=>document.getElementById(id);
const key='pblm_os_v1_';
const get=(k,d='')=>{try{return localStorage.getItem(key+k)??d}catch{return d}};
const put=(k,v)=>{try{localStorage.setItem(key+k,v)}catch{alert('Não foi possível salvar neste navegador.')}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const validUrl=s=>{try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}};
function apply(){const c=get('accent','#c41436');if(/^#[0-9a-f]{6}$/i.test(c))document.documentElement.style.setProperty('--accent',c)}
function renderDesktop(){const tile=([id,icon,name,desc])=>`<button class="tile" data-app="${id}"><div class="emoji">${icon}</div><b>${name}</b><span>${desc}</span></button>`;$('desktop').innerHTML=APPS.map(tile).join('');$('dock').innerHTML=APPS.filter(x=>['home','terminal','notes','tasks','settings'].includes(x[0])).map(([id,icon,name])=>`<button data-app="${id}" title="${name}" aria-label="${name}">${icon}</button>`).join('')}
function closeApp(){$('window').classList.remove('active')}
function openApp(id){if(id==='home'){closeApp();location.href='./index.html';return}const app=APPS.find(a=>a[0]===id);if(!app)return;$('winTitle').textContent=app[1]+' '+app[2];$('window').classList.add('active');const body=$('winBody');if(id==='notes'){body.innerHTML='<label for="notes">Suas anotações (salvas neste navegador)</label><textarea id="notes"></textarea><p id="saved">Salvamento automático ativado</p>';$('notes').value=get('notes');$('notes').addEventListener('input',e=>put('notes',e.target.value))}
if(id==='tasks'){body.innerHTML='<label for="task">Nova tarefa</label><form id="taskform" style="display:flex;gap:8px"><input id="task" required maxlength="140"><button class="btn primary">Adicionar</button></form><div id="tasklist"></div>';$('taskform').onsubmit=e=>{e.preventDefault();const a=tasks();a.push({text:$('task').value,done:false});put('tasks',JSON.stringify(a));$('task').value='';renderTasks()};renderTasks()}
if(id==='terminal'){body.innerHTML='<pre id="output">⛧ PARABELLUM TERMINAL\nDigite help para listar comandos.\n</pre><form id="termform" style="display:flex;gap:8px"><input id="cmd" aria-label="Comando" autocomplete="off" placeholder="help"><button class="btn primary">Executar</button></form>';$('termform').onsubmit=e=>{e.preventDefault();const cmd=$('cmd').value.trim().toLowerCase();$('cmd').value='';const commands={help:'help • date • whoami • apps • clear • portal • settings',date:new Date().toLocaleString('pt-BR'),whoami:'Membro PARABELLUM • sessão local',apps:APPS.map(x=>x[2]).join(' • ')};if(cmd==='clear'){$('output').textContent='';return}if(cmd==='portal'){openApp('home');return}if(cmd==='settings'){openApp('settings');return}$('output').textContent+='\\n> '+cmd+'\\n'+(commands[cmd]||'Comando desconhecido. Use help.')+'\\n'}}
if(id==='links'){body.innerHTML='<p>Adicione links públicos. Eles ficam salvos apenas neste dispositivo.</p><label for="linkName">Nome</label><input id="linkName" maxlength="60" placeholder="Instagram"><label for="linkUrl">URL HTTPS</label><input id="linkUrl" placeholder="https://..."><button class="btn primary" id="addlink" style="margin-top:12px">Adicionar link</button><div id="linklist"></div>';$('addlink').onclick=()=>{const url=validUrl($('linkUrl').value);if(!url){alert('Informe um endereço http ou https válido.');return}const a=links();a.push({name:$('linkName').value.trim().slice(0,60)||'Link',url});put('links',JSON.stringify(a));$('linkName').value='';$('linkUrl').value='';renderLinks()};renderLinks()}
if(id==='files'){body.innerHTML='<p>Links para os arquivos e páginas do projeto.</p><div class="cards"><a class="card" href="./index.html">🏠 Portal principal</a><a class="card" href="./preferencias.html">⚙ Preferências originais</a><a class="card" href="https://github.com/k9dxx/parabellum-panel" target="_blank" rel="noopener noreferrer">📁 Repositório GitHub</a></div>'}
if(id==='settings'){body.innerHTML='<label for="color">Cor de destaque</label><input id="color" type="color" style="height:52px;padding:5px" value="'+esc(get('accent','#c41436'))+'"><p>Essa escolha afeta somente o PARABELLUM OS neste navegador.</p><button class="btn" id="reset">Restaurar vermelho original</button>';$('color').oninput=e=>{put('accent',e.target.value);apply()};$('reset').onclick=()=>{put('accent','#c41436');apply();$('color').value='#c41436'}}
if(id==='about'){body.innerHTML='<h2>⛧ PARABELLUM OS v1.0</h2><p>Desktop responsivo, terminal de navegação, notas, tarefas, links e personalização. Esta primeira versão funciona sem servidor e não lê nem altera contas de usuários.</p><p>Os dados ficam no armazenamento local do navegador. Limpar os dados do site pode apagá-los.</p>'}
}
function tasks(){try{const a=JSON.parse(get('tasks','[]'));return Array.isArray(a)?a:[]}catch{return []}}
function links(){try{const a=JSON.parse(get('links','[]'));return Array.isArray(a)?a:[]}catch{return []}}
function renderTasks(){$('tasklist').innerHTML=tasks().map((t,i)=>`<div class="card" style="margin-top:8px;display:flex;gap:8px;align-items:center"><input type="checkbox" data-done="${i}" ${t.done?'checked':''} style="width:auto"><span style="flex:1;${t.done?'text-decoration:line-through':''}">${esc(t.text)}</span><button class="btn" data-remove="${i}">✕</button></div>`).join('')}
function renderLinks(){$('linklist').innerHTML=links().map((l,i)=>{const url=validUrl(l.url);return `<div class="card" style="margin-top:8px;display:flex;gap:10px"><span style="flex:1">${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(l.name)}</a>`:esc(l.name)}</span><button class="btn" data-unlink="${i}">✕</button></div>`}).join('')}
document.addEventListener('click',e=>{const app=e.target.closest('[data-app]');if(app)openApp(app.dataset.app);const d=e.target.closest('[data-remove]');if(d){const a=tasks();a.splice(+d.dataset.remove,1);put('tasks',JSON.stringify(a));renderTasks()}const l=e.target.closest('[data-unlink]');if(l){const a=links();a.splice(+l.dataset.unlink,1);put('links',JSON.stringify(a));renderLinks()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-done]')){const a=tasks();if(a[+e.target.dataset.done])a[+e.target.dataset.done].done=e.target.checked;put('tasks',JSON.stringify(a));renderTasks()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeApp()});
function clock(){$('clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
apply();renderDesktop();clock();setInterval(clock,30000);
</script></body></html>
